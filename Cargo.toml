[package]
name = "netnix"
version = "0.1.0"
authors = ["Michiel van den Heuvel <michielvdnheuvel@gmail.com>"]
edition = "2018"

[dependencies]
directories = "3"
jiff = "0.2"
lazy_static = "1.4.0"
symphonia = { version = "0.6.1", default-features = false, features = ["all-meta", "flac", "mp3", "isomp4", "mkv", "wav"] }
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
